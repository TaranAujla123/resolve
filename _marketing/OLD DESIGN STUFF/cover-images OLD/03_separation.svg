<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#f7f8fa"/>

  <!-- Soft inner border -->
  <rect x="40" y="40" width="1000" height="1000" fill="none" stroke="#dde2eb" stroke-width="1"/>

  <!-- Eyebrow (top-left) -->
  <text x="80" y="110" font-family="Inter, Manrope, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700"
        fill="#0e8ba3" letter-spacing="3">RESOLVE · SITUATION</text>

  <!-- Hook (center-left) -->
  <text x="80" y="477.8" font-family="Inter, Manrope, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="800" fill="#0b1f3d" letter-spacing="-1.2">Selling the matrimonial</text>
  <text x="80" y="557.8" font-family="Inter, Manrope, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="800" fill="#0b1f3d" letter-spacing="-1.2">home should not</text>
  <text x="80" y="637.7" font-family="Inter, Manrope, 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="800" fill="#0b1f3d" letter-spacing="-1.2">blow up the file.</text>

  <!-- Sage dot accent under hook -->
