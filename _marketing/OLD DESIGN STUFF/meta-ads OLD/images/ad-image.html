<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;}
  body{
    background:#FBFBF9;
    font-family:'Inter','Segoe UI',Arial,sans-serif;
    color:#0A1F44;
    position:relative;
    overflow:hidden;
  }
  .pad{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:space-between;
    box-sizing:border-box;
  }
  .brand{ font-weight:600; letter-spacing:-0.01em; }
  .brand .dot{ color:#1F8B5A; }
  .headline{ font-weight:600; line-height:1.12; letter-spacing:-0.02em; }
  .foot{ font-weight:500; color:#5b6b86; }
  .foot .legal{ display:block; color:#8a97ab; }
  /* navy variant */
  body.navy{ background:#0A1F44; color:#FBFBF9; }
  body.navy .foot{ color:#9fb0c9; }
  body.navy .foot .legal{ color:#74849c; }
</style>
</head>
<body>
<div class="pad">
  <div class="brand">Resolve<span class="dot">.</span></div>
  <div class="headline"></div>
  <div class="foot">resolveproperty.ca<span class="legal">HomeLife G1 Realty Inc., Brokerage</span></div>
</div>
<script>
  const P = new URLSearchParams(location.search);
  const v = P.get('v') || 'pos';
  const w = parseInt(P.get('w') || '1080', 10);
  const h = parseInt(P.get('h') || '1080', 10);
  const navy = P.get('bg') === 'navy';

  const HEADLINES = {
    pos:     'Power of sale is not the end of your options.',
    estate:  'Selling a family home, handled with care.',
    divorce: 'A fair sale, so you can both move forward.',
    general: 'Sell well, even when the timing was not your choice.'
  };

  document.body.style.width  = w + 'px';
  document.body.style.height = h + 'px';
  if (navy) document.body.classList.add('navy');

  const tall = h >= 1700;
  const pad = Math.round(w * 0.092);
  document.querySelector('.pad').style.padding = pad + 'px';

  const brand = document.querySelector('.brand');
  brand.style.fontSize = Math.round(w * 0.040) + 'px';

  const hl = document.querySelector('.headline');
  hl.textContent = HEADLINES[v] || HEADLINES.pos;
  hl.style.fontSize = Math.round(w * (tall ? 0.082 : 0.072)) + 'px';
  hl.style.maxWidth = tall ? '92%' : '82%';
  if (tall) hl.style.marginBottom = Math.round(h * 0.06) + 'px';

  const foot = document.querySelector('.foot');
  foot.style.fontSize = Math.round(w * 0.026) + 'px';
  foot.querySelector('.legal').style.fontSize = Math.round(w * 0.018) + 'px';
  foot.querySelector('.legal').style.marginTop = Math.round(w * 0.008) + 'px';
</script>
</body>
</html>
